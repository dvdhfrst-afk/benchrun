[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "benchrun"
dynamic = ["version"]
description = "Automated bench test runner: SCPI over TCP, JSON test plans, SQLite results, simulators included."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "The benchrun authors" }]
keywords = ["scpi", "test automation", "test bench", "instruments", "manufacturing test"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Manufacturing",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Topic :: Scientific/Engineering",
    "Topic :: System :: Hardware",
]
dependencies = []

[project.scripts]
benchrun = "benchrun.cli:main"

[tool.setuptools.dynamic]
version = { attr = "benchrun.__version__" }

[tool.setuptools.packages.find]
include = ["benchrun*"]
